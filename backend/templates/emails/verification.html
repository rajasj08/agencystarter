<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your email</title>
</head>
<body style="margin: 0; font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; color: #111827; background-color: #f8fafc; padding: 24px;">
  <h1>Verify your email</h1>
  <p>Hi {{userName}},</p>
  <p>Thanks for signing up for {{organizationName}}. Click the button below to verify your email address.</p>
  <p><a href="{{verificationLink}}" class="email-cta-button" style="display: inline-block; background: #3b82f6; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 500;">Verify email</a></p>
  <p>If you didn't create an account, you can ignore this email.</p>
  <p>— {{organizationName}}</p>
</body>
</html>
