name: Security Regression

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Backend build
        run: npm run build --prefix backend

      - name: Security invariant tests
        run: npm run test --prefix backend -- src/__tests__/security-invariants.invariant.test.ts src/__tests__/security-chaos.invariant.test.ts src/__tests__/sso-security.invariant.test.ts

